function cekKelulusan() {
  const nisn = document.getElementById("nisnInput").value.trim();
  const resultDiv = document.getElementById("result");
  const siswa = dataSiswa.find(s => s.nisn === nisn);

  if (siswa) {
    const statusClass = siswa.keterangan.toLowerCase() === "lulus" ? "lulus" : "tidak-lulus";
    resultDiv.className = statusClass;
    resultDiv.innerHTML = `
      <h3>Data Siswa Ditemukan:</h3>
      <p><strong>Nama:</strong> ${siswa.nama}</p>
      <p><strong>Kelas:</strong> ${siswa.kelas}</p>
      <p><strong>Status:</strong> ${siswa.keterangan}</p>
    `;
  } else {
    resultDiv.className = "not-found";
    resultDiv.innerHTML = `<strong>Data tidak ditemukan. Periksa kembali NISN Anda.</strong>`;
  }
}
